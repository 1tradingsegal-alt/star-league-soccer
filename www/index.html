<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star League Soccer</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#050b1c;color:#fff;font-family:Vazirmatn,Tahoma,Arial,sans-serif;user-select:none;-webkit-user-select:none}
#ui{position:fixed;inset:0;overflow-y:auto;background:
 radial-gradient(ellipse at 50% -10%,#1d3f8f 0%,transparent 60%),
 repeating-linear-gradient(115deg,#0a1430 0 22px,#0c1838 22px 44px);}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(#162a5c,#0b1636);border:2px solid #2d4f9e;border-radius:14px;margin-bottom:12px;box-shadow:0 4px 0 #050b1c}
.top .nm{font-weight:900;font-size:17px;line-height:1.2}
.top .sub{font-size:12px;color:#9fb6ea}
.coins{margin-inline-start:auto;display:flex;align-items:center;gap:6px;background:#050b1c;border:2px solid #ffcc00;border-radius:20px;padding:4px 12px;font-weight:900;color:#ffdd44;direction:ltr}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffcc00 45%,#b8860b);box-shadow:0 0 0 2px #7a5a00 inset}
h1.logo{font-size:40px;font-weight:900;font-style:italic;text-align:center;letter-spacing:1px;line-height:1;margin:26px 0 4px;direction:ltr;
 background:linear-gradient(#fff 30%,#ffd23f 60%,#ff9d00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0a1a45)}
.tag{text-align:center;color:#9fb6ea;margin-bottom:24px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:16px;padding:16px 14px;min-height:96px;cursor:pointer;overflow:hidden;
 background:linear-gradient(160deg,#21428f,#0f2058);border:2px solid #3a63c4;box-shadow:0 5px 0 #071030,inset 0 1px 0 #5c86e6;transition:transform .08s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #071030}
.tile .ic{font-size:30px;line-height:1}
.tile .t{font-weight:900;font-size:17px;margin-top:6px}
.tile .d{font-size:12px;color:#b9cbf3;margin-top:2px}
.tile.big{grid-column:1/-1;min-height:120px;background:linear-gradient(160deg,#18a34a,#0b6b2c);border-color:#47e07c;box-shadow:0 5px 0 #053516,inset 0 1px 0 #8ef5ad}
.tile.gold{background:linear-gradient(160deg,#ffb300,#c76f00);border-color:#ffd65c;box-shadow:0 5px 0 #6b3a00,inset 0 1px 0 #ffe9a3}
.tile.red{background:linear-gradient(160deg,#d63031,#8a1414);border-color:#ff7b7b;box-shadow:0 5px 0 #4a0909}
.tile::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;background:rgba(255,255,255,.07);transform:rotate(25deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 18px;font:900 16px Vazirmatn,Tahoma,Arial,sans-serif;color:#fff;cursor:pointer;
 background:linear-gradient(#2ed15f,#139c3c);box-shadow:0 4px 0 #0a5a22;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a5a22}
.btn.blue{background:linear-gradient(#3a7bff,#1d4fd1);box-shadow:0 4px 0 #0e2a7a}
.btn.gray{background:linear-gradient(#56627e,#37415a);box-shadow:0 4px 0 #1b2234}
.btn.red{background:linear-gradient(#ff5252,#c62828);box-shadow:0 4px 0 #6b0f0f}
.btn.gold{background:linear-gradient(#ffd23f,#e09b00);box-shadow:0 4px 0 #7a4b00;color:#2a1a00}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:linear-gradient(#13254f,#0b1736);border:2px solid #2a4a96;border-radius:16px;padding:14px;margin-bottom:12px}
.panel h3{font-size:16px;font-weight:900;margin-bottom:10px;color:#ffd23f}
label.f{display:block;font-size:13px;color:#9fb6ea;margin:10px 0 5px}
input[type=text],select,textarea{width:100%;background:#071026;border:2px solid #2d4f9e;border-radius:10px;color:#fff;font:700 15px Vazirmatn,Tahoma,Arial,sans-serif;padding:10px}
textarea{font-size:11px;direction:ltr;height:80px}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw span{width:34px;height:34px;border-radius:9px;border:3px solid #0006;cursor:pointer}
.sw span.on{border-color:#ffd23f;box-shadow:0 0 0 2px #fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:20px;background:#0a1633;border:2px solid #2d4f9e;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:#ffd23f;color:#2a1a00;border-color:#fff}
.back{background:none;border:none;color:#fff;font-size:26px;cursor:pointer;padding:0 6px}
table.tb{width:100%;border-collapse:collapse;font-size:13px;direction:ltr}
.tb th{color:#9fb6ea;font-weight:700;padding:6px 4px;text-align:center}
.tb td{padding:7px 4px;text-align:center;border-top:1px solid #1e3570}
.tb td.n{text-align:left;font-weight:700;display:flex;align-items:center;gap:6px}
.tb tr.me td{background:#ffd23f22;color:#ffe680}
.tb tr.up td:first-child{border-left:4px solid #2ecc71}.tb tr.dn td:first-child{border-left:4px solid #e74c3c}
.pl{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#0a1633;border:2px solid #1e3570;margin-bottom:7px;cursor:pointer;direction:ltr}
.pl.sel{border-color:#ffd23f;background:#2a2a10}
.pl .rt{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:none}
.pl .pn{font-weight:900;font-size:14px}
.pl .ps{font-size:11px;color:#9fb6ea}
.pl .r{margin-left:auto;text-align:right}
.pos{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:1px 5px;font-size:11px;font-weight:900;margin-right:6px}
.GK{background:#f1c40f;color:#000}.DF{background:#2980ff}.MF{background:#2ecc71;color:#032}.FW{background:#e74c3c}
.vs{display:flex;align-items:center;justify-content:space-around;text-align:center;padding:10px 0}
.vs .t{width:40%}.vs .t b{display:block;margin-top:6px;font-size:15px;direction:ltr}
.vs .x{font-size:30px;font-weight:900;color:#ffd23f;font-style:italic}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.info div{background:#071026;border-radius:10px;padding:8px}
.info small{display:block;color:#9fb6ea;font-size:11px}
.note{font-size:13px;color:#c5d3f5;line-height:1.9}
.dlg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.dlg>div{max-width:420px;width:100%;background:linear-gradient(#1a3270,#0c1a42);border:3px solid #ffd23f;border-radius:18px;padding:20px;text-align:center}
.dlg p{margin:10px 0 16px;line-height:1.8}
/* ===== match ===== */
#cv{position:fixed;inset:0;width:100%;height:100%;display:none;touch-action:none;background:#0b2a12}
#hud{position:fixed;inset:0;display:none;pointer-events:none;direction:ltr}
#score{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;display:flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 3px 0 #0008;font-weight:900;font-size:15px}
#score .tm{padding:5px 8px;background:#0b1636e6;display:flex;align-items:center;gap:5px}
#score .sc{padding:5px 10px;background:#fff;color:#0b1636;font-size:17px}
#score .clk{padding:5px 8px;background:#ffd23f;color:#2a1a00;min-width:46px;text-align:center}
#score .kit{width:6px;height:16px;border-radius:2px}
#meta{position:absolute;top:calc(44px + env(safe-area-inset-top));left:8px;font-size:11px;background:#0008;padding:3px 8px;border-radius:8px;color:#dfe8ff}
#pauseB{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;width:40px;height:40px;border-radius:10px;background:#0b1636e6;border:2px solid #3a63c4;color:#fff;font-size:18px;pointer-events:auto}
#banner{position:absolute;top:30%;left:0;right:0;text-align:center;font-weight:900;font-style:italic;font-size:44px;color:#fff;text-shadow:0 4px 0 #0b1636,0 0 20px #000;pointer-events:none;opacity:0;transition:opacity .25s;font-family:Vazirmatn,Tahoma,Arial,sans-serif}
#banner small{display:block;font-size:18px;font-style:normal;color:#ffd23f}
.pad{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;color:#fff;font-size:13px;
 border:3px solid #fff8;box-shadow:0 4px 0 #0007,inset 0 2px 0 #fff6;font-family:Vazirmatn,Tahoma,Arial,sans-serif;touch-action:none}
.pad i{font-style:normal;font-size:22px;line-height:1}
.pad.dn{transform:scale(.92);filter:brightness(1.3)}
#bShoot{width:86px;height:86px;right:18px;bottom:calc(26px + env(safe-area-inset-bottom));background:radial-gradient(circle at 40% 30%,#ff7a5c,#d62a10)}
#bPass{width:72px;height:72px;right:118px;bottom:calc(20px + env(safe-area-inset-bottom));background:radial-gradient(circle at 40% 30%,#4fe37f,#13a043)}
#bSprint{width:64px;height:64px;right:40px;bottom:calc(128px + env(safe-area-inset-bottom));background:radial-gradient(circle at 40% 30%,#5d9bff,#1d4fd1)}
#joyZone{position:absolute;left:0;bottom:0;width:55%;height:60%;pointer-events:auto;touch-action:none}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid #fff5;background:#ffffff14;display:none;pointer-events:none}
#joy b{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#bcd0ff);box-shadow:0 3px 8px #0008}
#joyHint{position:absolute;left:24px;bottom:calc(40px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;border:3px dashed #fff3;pointer-events:none}
</style>
</head>
<body>
<div id="ui"></div>
<canvas id="cv"></canvas>
<div id="hud">
 <div id="score"></div>
 <div id="meta"></div>
 <button id="pauseB">❚❚</button>
 <div id="banner"></div>
 <div id="joyZone"><div id="joyHint"></div><div id="joy"><b></b></div></div>
 <div class="pad" id="bSprint"><i>⚡</i><span>سرعت</span></div>
 <div class="pad" id="bPass"><i>➜</i><span id="lPass">پاس</span></div>
 <div class="pad" id="bShoot"><i>⚽</i><span id="lShoot">شوت</span></div>
</div>

'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const randn=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const uid=()=>Math.random().toString(36).slice(2,9);
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function lum(h){const[r,g,b]=hex2rgb(h);return(0.299*r+0.587*g+0.114*b)/255}
function cdist(a,b){const x=hex2rgb(a),y=hex2rgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])}
function contrast(bg,pref){return pref&&cdist(bg,pref)>110?pref:(lum(bg)>0.6?'#111':'#fff')}
function hashStr(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

 const st=`fill="${c}" stroke="${c2}" stroke-width="6" stroke-linejoin="round"`;

  case 'circle':sh=`<circle cx="50" cy="50" r="44" ${st}/><circle cx="50" cy="50" r="33" fill="none" stroke="${c2}" stroke-width="2"/>`;break;
  case 'hex':sh=`<polygon points="50,4 92,27 92,73 50,96 8,73 8,27" ${st}/>`;break;
  case 'star':sh=`<polygon points="50,2 61,34 96,35 68,56 78,92 50,72 22,92 32,56 4,35 39,34" ${st}/>`;break;
  case 'diamond':sh=`<polygon points="50,3 97,50 50,97 3,50" ${st}/>`;break;
  case 'crown':sh=`<path d="M14 30 L28 44 L40 22 L50 40 L60 22 L72 44 L86 30 L84 62 Q78 86 50 96 Q22 86 16 62 Z" ${st}/>`;break;

 }

 return `<svg viewBox="0 0 100 100" width="${sz}" height="${sz}" style="flex:none">${sh}<text x="50" y="${l.shape==='star'?62:60}" text-anchor="middle" font-size="${fs}" font-weight="900" font-family="Arial Black,Arial" fill="${c2}">${esc(abbr)}</text></svg>`;

/* ---------- league structure ---------- */
function roundRobin(n){const ids=[...Array(n).keys()];if(n%2)ids.push(-1);const m=ids.length,rounds=[];let arr=ids.slice();
 for(let r=0;r<m-1;r++){const rd=[];for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i];if(a>=0&&b>=0)rd.push(r%2?[b,a]:[a,b])}rounds.push(rd);arr=[arr[0],arr[m-1],...arr.slice(1,m-1)]}
 return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])))}
function mkLeague(teams){return{teams,rounds:roundRobin(teams.length),round:0,table:teams.map(()=>({p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),
 fx:roundRobin(teams.length).map(()=>({wx:pick(Object.keys(WX)),ref:ri(0,REFS.length-1)}))}}
function addResult(L,h,a,hg,ag){const th=L.table[h],ta=L.table[a];th.p++;ta.p++;th.gf+=hg;th.ga+=ag;ta.gf+=ag;ta.ga+=hg;
 if(hg>ag){th.w++;ta.l++;th.pts+=3}else if(hg<ag){ta.w++;th.l++;ta.pts+=3}else{th.d++;ta.d++;th.pts++;ta.pts++}}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return Math.min(k-1,7)}
function simMatch(rh,ra){return[poisson(1.35*Math.exp((rh-ra)/20)),poisson(1.1*Math.exp((ra-rh)/20))]}
function standings(L){return L.table.map((t,i)=>({...t,i,gd:t.gf-t.ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf)}
function newCareerSeason(){
 const c=S.career,dv=DIVS[c.div],[lo,hi]=dv.r;
 const pool=ALLCLUBS.slice().sort((a,b)=>b.s-a.s);const start=(c.div-1)*Math.floor(pool.length/5);
 const chosen=shuffle(pool.slice(start,start+Math.floor(pool.length/5)+3)).slice(0,7).sort((a,b)=>b.s-a.s);
 const teams=[{user:true,name:c.club.name}].concat(chosen.map((cl,i)=>({name:cl.name,abbr:cl.abbr,c1:cl.c1,c2:cl.c2,stadium:cl.stadium,
  r:Math.round(hi-(hi-lo)*(i/6))+ri(-1,1)})));
 c.league=mkLeague(teams);
 c.market=Array.from({length:10},()=>{const pos=pick(['GK','DF','DF','MF','MF','FW','FW']);return mkPlayer(rname(),pos,clamp(ri(lo-2,hi+3),40,90))}).sort((a,b)=>b.rat-a.rat);
}
function lineupPlayers(c){return c.lineup.map(id=>c.squad.find(p=>p.id===id))}
function teamRating(c){const l=lineupPlayers(c);return Math.round(l.reduce((s,p)=>s+p.rat,0)/l.length)}
function userStadium(c){return{name:c.stadium.name,cap:ST_LV[c.stadium.lv].cap,seat:c.club.c1,seat2:c.club.c2,lv:c.stadium.lv,own:true}}

 preMatch({home:mine,away:opp,isAway:!home,stadium:stadiumByName(home?mine.stadium:opp.stadium),wx:meta.wx,ref:REFS[meta.ref],mode:'world',
  onEnd:r=>{const hg=home?r.my:r.op,ag=home?r.op:r.my;addResult(L,fx[0],fx[1],hg,ag);simOthers(L,fx);L.round++;save();
   if(L.round>=L.rounds.length){const pos=standings(L).findIndex(t=>t.i===me)+1;dialog(`فصل تمام شد! ${esc(L.teams[me].name)} رتبه <b>${pos}</b> شد.${pos===1?' 🏆 قهرمان!':''}`,[['باشه',()=>{S.world=null;save();showWorld()}]])}else showWorld()}});

/* ---------- career match ---------- */
function playCareer(){
 const c=S.career,L=c.league,fx=L.rounds[L.round].find(m=>m[0]===0||m[1]===0),home=fx[0]===0,oi=home?fx[1]:fx[0],o=L.teams[oi],meta=L.fx[L.round];
 const opp=clubTeam(o.name,o.r);
 preMatch({home:myTeam(),away:opp,isAway:!home,stadium:home?userStadium(c):stadiumByName(o.stadium),wx:meta.wx,ref:REFS[meta.ref],mode:'career',
  onEnd:r=>{
   const hg=home?r.my:r.op,ag=home?r.op:r.my;addResult(L,fx[0],fx[1],hg,ag);simOthers(L,fx);
   L.round++;c.stats.gf+=r.my;c.stats.ga+=r.op;
   let earn=r.my>r.op?300:r.my===r.op?140:60;earn+=r.my*25;let inc=home?Math.round(ST_LV[c.stadium.lv].cap*0.02):0;

  const base=r+oop;

/* ---- passing / shooting ---- */
function doPass(p,dx,dy,lob,minCos){
 const d0=Math.hypot(dx,dy)||1;dx/=d0;dy/=d0;let best=null,bs=-1e9;
 for(const q of active(p.team)){if(q===p)continue;const ex=q.x-p.x,ey=q.y-p.y,d=Math.hypot(ex,ey);if(d<35||d>(lob?720:520))continue;
  const cs=(ex*dx+ey*dy)/d;if(cs<(minCos??0.5))continue;let open=200;for(const o of active(1-p.team)){open=Math.min(open,Math.hypot(o.x-q.x,o.y-q.y))}
  let lane=0;for(const o of active(1-p.team)){const t=((o.x-p.x)*ex+(o.y-p.y)*ey)/(d*d);if(t>0&&t<1){const px=p.x+ex*t-o.x,py=p.y+ey*t-o.y;if(Math.hypot(px,py)<18)lane+=lob?0.2:1}}
  const s=cs*2.6-d/500+Math.min(open,90)/55-lane*1.3;if(s>bs){bs=s;best=q}}

function doShoot(p,power,aim){

function setPiece(type,team,x,y){

function spAI(p){const t=M.sp;M.sp=null;p.lock=false;const gy=goalY(p.team);const dG=Math.hypot(W/2-p.x,gy-p.y);

 if(M.freeze>0){M.freeze-=dt;IN.ev.length=0;

  if(M.goalAnim){ballPhys(dt)}

 if(M.ended)return;
 // clock
 M.clock+=dt;
 if(M.clock>=M.halfLen){
  if(M.half===1){sfxWhistle(0.4,2);M.half=2;M.clock=0;banner('پایان نیمه اول',`${M.score[0]} - ${M.score[1]}`,2);M.freeze=2;M.after=()=>kickoff(1,true);return}
  else{endMatch();return}}
 for(const p of M.all){p.cd=Math.max(0,p.cd-dt);p.stun=Math.max(0,p.stun-dt);p.recv=Math.max(0,p.recv-dt);p.dive=Math.max(0,p.dive-dt)}
 M.switchCd-=dt;
 if(!M.ctrl||M.ctrl.red)M.ctrl=nearestTo(0,b.x,b.y);
 human(dt);
 autoSwitch();
 aiTeam(0,dt);aiTeam(1,dt);
 for(const t of[0,1]){const gk=active(t).find(p=>p.role==='GK');if(gk)aiGK(gk,dt)}
 movePlayers(dt);
 ballPhys(dt);
 contacts(dt);
 bounds();
 camUpd(dt);
}
function human(dt){
 const p=M.ctrl,b=M.ball;if(!p||M.auto)return;
 const own=b.owner===p;
 for(const e of IN.ev){
  if(e==='sd'){if(own)M.charge={k:'s',t:0};else if(!b.owner||b.owner.team===1){if(p.slide<=0&&p.stun<=0)startSlide(p)}}
  else if(e==='su'){if(M.charge&&M.charge.k==='s'){if(own)humanShoot(p,clamp(M.charge.t/0.75,0.05,1));M.charge=null}}
  else if(e==='pd'){if(own)M.charge={k:'p',t:0};else if(!b.owner||b.owner.team===1){const n=nearestTo(0,b.x+b.vx*0.2,b.y+b.vy*0.2,p);if(n){M.ctrl=n;M.switchCd=0.8}}}
  else if(e==='pu'){if(M.charge&&M.charge.k==='p'){if(own){const dx=IN.jm>0.2?IN.jx:p.dx,dy=IN.jm>0.2?IN.jy:p.dy;doPass(p,dx,dy,M.charge.t>0.28,0.45)}M.charge=null}}
 }
 IN.ev.length=0;
 if(M.charge){if(b.owner!==p)M.charge=null;else{M.charge.t+=dt;if(M.charge.k==='s'&&M.charge.t>0.9){humanShoot(p,1);M.charge=null}}}
 if(p.slide>0||p.stun>0)return;
 const mx=pMax(p)*(IN.sprint?1.3:1)*(own?0.88:1);
 if(p.lock){if(IN.jm>0.25){p.dx=IN.jx;p.dy=IN.jy}p.vx=p.vy=0;return}
 if(IN.jm>0.12){accel(p,IN.jx*mx*Math.min(1,IN.jm*1.2),IN.jy*mx*Math.min(1,IN.jm*1.2),dt,own?9:11)}
 else if(p.recv>0&&!b.owner){steer(p,b.x+b.vx*0.15,b.y+b.vy*0.15,1.05,dt)}
 else accel(p,0,0,dt,7);
}
function humanShoot(p,pw){let aim=null;if(IN.jm>0.25)aim=clamp(IN.jx*1.1,-1,1);doShoot(p,pw,aim)}
function startSlide(p){const sp=pMax(p)*1.55;let dx=p.dx,dy=p.dy;if(p.team===0&&p===M.ctrl&&IN.jm>0.2){dx=IN.jx;dy=IN.jy}
 const d=Math.hypot(dx,dy)||1;p.dx=dx/d;p.dy=dy/d;p.vx=p.dx*sp;p.vy=p.dy*sp;p.slide=0.42;p.slideHit=false}
function autoSwitch(){

function accel(p,vx,vy,dt,k){const a=Math.min(1,dt*(k||8));p.vx+=(vx-p.vx)*a;p.vy+=(vy-p.vy)*a}

 if(d<4)return accel(p,0,0,dt,6);const s=Math.min(mx,d*3.2);accel(p,dx/d*s,dy/d*s,dt,8)}
function possTeam(){const b=M.ball;return b.owner?b.owner.team:b.lastTouch?b.lastTouch.team:-1}
function formTarget(p){
 const b=M.ball,t=p.team,f=FORM[p.slot];const bx=t===0?b.x:W-b.x,by=t===0?b.y:H-b.y;const att=possTeam()===t;

function aiTeam(t,dt){
 const b=M.ball,ps=active(t).filter(p=>p.role!=='GK');const att=b.owner&&b.owner.team===t;

 if(!att){const s=ps.filter(p=>!(t===0&&p===M.ctrl&&!M.auto)).sort((a,c)=>Math.hypot(a.x-px,a.y-py)-Math.hypot(c.x-px,c.y-py));ch1=s[0];ch2=s[1];
  if(t===0&&!M.auto&&ch1&&Math.hypot(ch1.x-px,ch1.y-py)>(b.owner?110:170))ch1=null;
  if(t===0&&!M.auto)ch2=null}

 for(const p of ps){
  if(t===0&&p===M.ctrl&&!M.auto)continue;

  if(p===ch1){const o=b.owner;steer(p,o?o.x+o.dx*8:px,o?o.y+o.dy*8:py,(o?1.08:1.15)*lvl,dt);
   if(o&&o.team!==t&&t===1&&p.cd<=0){const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<30&&d>12&&Math.random()<dt*0.9*lvl)startSlide(p)}continue}
  if(p===ch2&&b.owner){const og=ownGoalY(t);const o=b.owner;const dx=W/2-o.x,dy=og-o.y,d=Math.hypot(dx,dy)||1;steer(p,o.x+dx/d*58,o.y+dy/d*58,1.05*lvl,dt);continue}
  const[tx,ty]=formTarget(p);steer(p,tx,ty,att?0.95:0.9,dt);
 }

function aiOwner(p,dt){
 const b=M.ball;
 if(p.lock){p.vx=p.vy=0;p.lockT+=dt;if(p.lockT>0.45)spAI(p);return}
 const gy=goalY(p.team),gx=W/2;const dG=Math.hypot(gx-p.x,gy-p.y);
 let near=null,nd=1e9;for(const o of active(1-p.team)){const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<nd){nd=d;near=o}}
 p.think-=dt;
 if(p.think<=0){p.think=rnd(0.18,0.4)*(p.team===1?1-DIFF[S.set.diff]/40:1);
  const inRange=Math.abs(gy-p.y)<260;
  let blk=0;for(const o of active(1-p.team)){if(o.role==='GK')continue;const ox=o.x-p.x,oy=o.y-p.y,od=Math.hypot(ox,oy);if(od<dG&&((ox*(gx-p.x)+oy*(gy-p.y))/(od*dG))>0.93)blk++}
  if(dG<95)return doShoot(p,rnd(0.5,0.9),null);
  if(inRange&&dG<250&&Math.random()<(dG<150?0.4:0.12)/(1+blk*1.5))return doShoot(p,rnd(0.55,1),null);
  if(nd<48&&Math.random()<0.6)return doPass(p,gx-p.x,gy-p.y,Math.random()<0.15,-0.3);
  if(Math.random()<0.07)return doPass(p,gx-p.x,gy-p.y,Math.random()<0.25,0);
  let dx=(gx-p.x)/dG,dy=(gy-p.y)/dG;
  if(near&&nd<100){const ax=p.x-near.x,ay=p.y-near.y,ad=Math.hypot(ax,ay)||1;const w=1.4*(1-nd/100);dx+=ax/ad*w;dy+=ay/ad*w*0.3;}
  if(p.x<40)dx+=0.6;if(p.x>W-40)dx-=0.6;const dd=Math.hypot(dx,dy)||1;p.ddx=dx/dd;p.ddy=dy/dd;
 }
 const mx=pMax(p)*(nd>90?1.08:0.95)*0.86;accel(p,(p.ddx||0)*mx,(p.ddy||(p.team===0?-1:1))*mx,dt,8);

function aiGK(g,dt){

 let tx=clamp(W/2+(b.x-W/2)*0.32,GX0+10,GX1-10),ty=og+(g.team===0?-1:1)*(16+clamp(dBall/22,0,38));

function movePlayers(dt){

 // separation

function makePitch(st,wx,cfg){
 const SC=1.4,c=document.createElement('canvas');c.width=(W+2*MARG)*SC;c.height=(H+2*MARG)*SC;const g=c.getContext('2d');g.scale(SC,SC);g.translate(MARG,MARG);
 const seed=hashStr(st.name);let rs=seed;const R=()=>{rs=(rs*16807)%2147483647;return rs/2147483647};
 // outside
 g.fillStyle='#1d2a1f';g.fillRect(-MARG,-MARG,W+2*MARG,H+2*MARG);
 const own=st.own,lv=own?st.lv:5;const depth=own?40+lv*26:MARG-58;
 const fill=own?clamp(0.25+lv*0.14,0.2,0.97):clamp(0.75+st.cap/400000,0.75,0.98);
 const inner=62;const crowdCols=[st.seat,st.seat2||'#fff','#ffffff','#1b1b1b','#c0392b','#2c3e50','#f1c40f',st.seat,st.seat];
 // stands concrete
 g.fillStyle='#3b3f4a';g.fillRect(-inner-depth,-inner-depth,W+2*(inner+depth),H+2*(inner+depth));
 if(own&&lv<2){g.fillStyle='#2b5a2b';for(let i=0;i<120;i++){const a=R()*Math.PI*2,rr=Math.max(W,H)*0.75+R()*80;g.beginPath();g.arc(W/2+Math.cos(a)*rr*0.8,H/2+Math.sin(a)*rr,10+R()*14,0,7);g.fill()}}
 const cell=6;
 for(let y=-inner-depth;y<H+inner+depth;y+=cell)for(let x=-inner-depth;x<W+inner+depth;x+=cell){
  if(x>-inner-cell&&x<W+inner&&y>-inner-cell&&y<H+inner)continue;
  const dist=Math.min(Math.abs(x+inner),Math.abs(x-W-inner),Math.abs(y+inner),Math.abs(y-H-inner));
  if(Math.floor(dist/cell)%12===11){g.fillStyle='#2a2d35';g.fillRect(x,y,cell,cell);continue}
  if(R()<fill){g.fillStyle=crowdCols[Math.floor(R()*crowdCols.length)];g.fillRect(x+1,y+1,cell-2,cell-2);g.fillStyle='rgba(255,220,180,0.5)';g.fillRect(x+2,y+1,2,2)}
  else{g.fillStyle=shade(st.seat,-0.25);g.fillRect(x+0.5,y+0.5,cell-1,cell-1)}}
 // roof shade
 const rg=g.createLinearGradient(0,0,0,1);g.fillStyle='rgba(0,0,0,0.28)';
 g.fillRect(-inner-depth,-inner-depth,W+2*(inner+depth),depth*0.35);g.fillRect(-inner-depth,H+inner+depth*0.65,W+2*(inner+depth),depth*0.35);
 g.fillRect(-inner-depth,-inner-depth,depth*0.35,H+2*(inner+depth));g.fillRect(W+inner+depth*0.65,-inner-depth,depth*0.35,H+2*(inner+depth));
 // grass surround
 const g1=wx.snow?'#c9d6cf':'#2f8a3c',g2=wx.snow?'#d8e3dd':'#37984a';
 g.fillStyle=shade(g1,-0.08);g.fillRect(-inner,-inner,W+2*inner,H+2*inner);
 // ad boards
 const ads=['STAR LEAGUE','⚽ '+st.name.toUpperCase(),'SUPER SPORT','GOLDEN BOOTS','PLAY FAST'];const adc=['#0d47a1','#c62828','#111','#ff8f00','#2e7d32'];
 g.font='bold 11px Arial';g.textAlign='center';g.textBaseline='middle';
 for(let x=-40,i=0;x<W+40;x+=110,i++){for(const yy of[-46,H+34]){g.fillStyle=adc[i%5];g.fillRect(x,yy,108,12);g.fillStyle='#fff';g.fillText(ads[i%5].slice(0,20),x+54,yy+6.5)}}
 for(let y=-40,i=0;y<H+40;y+=110,i++){for(const xx of[-46,W+34]){g.fillStyle=adc[(i+2)%5];g.fillRect(xx,y,12,108);g.save();g.translate(xx+6,y+54);g.rotate(xx<0?-Math.PI/2:Math.PI/2);g.fillStyle='#fff';g.fillText(ads[(i+2)%5].slice(0,20),0,0.5);g.restore()}}
 // pitch stripes
 const n=14;for(let i=0;i<n;i++){g.fillStyle=i%2?g1:g2;g.fillRect(-30,-30+i*(H+60)/n,W+60,(H+60)/n+1)}
 // grass noise
 for(let i=0;i<5000;i++){g.fillStyle=wx.snow?(R()<0.5?'rgba(255,255,255,0.5)':'rgba(120,150,130,0.2)'):(R()<0.5?'rgba(0,0,0,0.05)':'rgba(255,255,255,0.04)');g.fillRect(-30+R()*(W+60),-30+R()*(H+60),2+R()*3,2+R()*3)}
 // lines
 g.strokeStyle=wx.snow?'#7fb0ff':'rgba(255,255,255,0.92)';g.lineWidth=3;
 g.strokeRect(0,0,W,H);g.beginPath();g.moveTo(0,H/2);g.lineTo(W,H/2);g.stroke();
 g.beginPath();g.arc(W/2,H/2,91.5,0,Math.PI*2);g.stroke();
 g.fillStyle=g.strokeStyle;g.beginPath();g.arc(W/2,H/2,4,0,7);g.fill();
 for(const top of[true,false]){const y0=top?0:H,s=top?1:-1;
  g.strokeRect((W-BOXW)/2,top?0:H-BOXD,BOXW,BOXD);g.strokeRect((W-183)/2,top?0:H-55,183,55);
  g.beginPath();g.arc(W/2,y0+s*110,4,0,7);g.fill();
  g.beginPath();if(top)g.arc(W/2,110,91.5,0.205*Math.PI,0.795*Math.PI);else g.arc(W/2,H-110,91.5,1.205*Math.PI,1.795*Math.PI);g.stroke();
  for(const cx of[0,W]){g.beginPath();g.arc(cx,y0,10,top?(cx?Math.PI/2:0):(cx?Math.PI:1.5*Math.PI),top?(cx?Math.PI:Math.PI/2):(cx?1.5*Math.PI:2*Math.PI));g.stroke()}}
 // center logo text
 g.save();g.globalAlpha=0.12;g.fillStyle='#fff';g.font='900 34px Arial';g.fillText(own&&cfg&&cfg.home?cfg.home.abbr:'★',W/2,H/2+2);g.restore();
 // goals
 for(const top of[true,false]){const y0=top?0:H,d=top?-28:28;
  g.fillStyle='rgba(255,255,255,0.12)';g.fillRect(GX0,top?-28:H,GW,28);
  g.strokeStyle='rgba(255,255,255,0.45)';g.lineWidth=1;for(let x=GX0;x<=GX1;x+=7){g.beginPath();g.moveTo(x,y0);g.lineTo(x,y0+d);g.stroke()}
  for(let k=0;k<=28;k+=7){g.beginPath();g.moveTo(GX0,y0+(top?-k:k));g.lineTo(GX1,y0+(top?-k:k));g.stroke()}
  g.strokeStyle='#fff';g.lineWidth=5;g.beginPath();g.moveTo(GX0,y0);g.lineTo(GX0,y0+d);g.lineTo(GX1,y0+d);g.lineTo(GX1,y0);g.stroke();
  g.fillStyle='#fff';g.beginPath();g.arc(GX0,y0,4,0,7);g.arc(GX1,y0,4,0,7);g.fill()}
 // floodlight towers
 for(const[x,y]of[[-inner-depth+10,-inner-depth+10],[W+inner+depth-10,-inner-depth+10],[-inner-depth+10,H+inner+depth-10],[W+inner+depth-10,H+inner+depth-10]]){g.fillStyle='#555';g.fillRect(x-14,y-8,28,16);g.fillStyle=wx.night?'#fffbd0':'#ddd';for(let i=0;i<4;i++)g.fillRect(x-12+i*6.5,y-6,5,5)}
 return c;
}
function shade(h,a){const[r,g,b]=hex2rgb(h);const f=v=>Math.round(clamp(a<0?v*(1+a):v+(255-v)*a,0,255));return`rgb(${f(r)},${f(g)},${f(b)})`}
function initParts(){M.parts=[];const p=M.wx.part;const n=p==='rain'?170:p==='snow'?130:p==='leaf'?26:0;for(let i=0;i<n;i++)M.parts.push({x:Math.random(),y:Math.random(),s:rnd(0.5,1),r:rnd(0,6)})}
function updParts(dt){const p=M.wx.part;for(const q of M.parts){if(p==='rain'){q.y+=dt*1.6*q.s;q.x+=dt*0.25*q.s}else if(p==='snow'){q.y+=dt*0.12*q.s;q.x+=Math.sin(M.time+q.r)*dt*0.04}else{q.x+=dt*0.5*q.s*Math.sign(M.wind||1);q.y+=Math.sin(M.time*2+q.r)*dt*0.1;q.r+=dt*4}
 if(q.y>1.05){q.y=-0.05;q.x=Math.random()}if(q.x>1.05)q.x=-0.05;if(q.x<-0.05)q.x=1.05}}
function drawPlayer(g,p,kit,gkKit){
 const x=p.x,y=p.y;const ang=Math.atan2(p.dy,p.dx);
 g.save();g.translate(x,y);g.scale(1.22,1.22);
 g.fillStyle='rgba(0,0,0,0.28)';g.beginPath();g.ellipse(3,4,9,6,0,0,7);g.fill();
 g.rotate(ang);
 const sp=Math.hypot(p.vx,p.vy);const sw=p.slide>0?0:Math.sin(p.anim)*Math.min(1,sp/80)*5;
 // legs
 g.fillStyle='#222';
 if(p.slide>0){g.fillRect(2,-6,11,3.5);g.fillRect(4,2,9,3.5)}
 else{g.beginPath();g.ellipse(sw,-3.5,3.2,2.2,0,0,7);g.ellipse(-sw,3.5,3.2,2.2,0,0,7);g.fill()}
 // body
 const c1=gkKit||kit.c1,c2=gkKit?'#222':kit.c2;
 g.fillStyle=c1;g.beginPath();g.ellipse(0,0,5.2,8.6,0,0,7);g.fill();
 if(!gkKit&&kit.pat!=='solid'){g.save();g.beginPath();g.ellipse(0,0,5.2,8.6,0,0,7);g.clip();g.fillStyle=c2;
  if(kit.pat==='stripes'){g.fillRect(-6,-1.3,12,2.6);g.fillRect(-6,-6,12,2.2);g.fillRect(-6,4,12,2.2)}else if(kit.pat==='hoops'){g.fillRect(-1.5,-9,3,18)}else if(kit.pat==='half'){g.fillRect(-6,0,12,9)}else{g.rotate(0.7);g.fillRect(-1.6,-10,3.2,20)}g.restore()}
 g.strokeStyle='rgba(0,0,0,0.45)';g.lineWidth=1;g.beginPath();g.ellipse(0,0,5.2,8.6,0,0,7);g.stroke();
 // arms
 g.fillStyle=p.skin;const as=p.slide>0?0:-sw*0.6;g.beginPath();g.arc(as,-9,1.9,0,7);g.arc(-as,9,1.9,0,7);g.fill();
 // head
 g.fillStyle=p.skin;g.beginPath();g.arc(0.8,0,4.3,0,7);g.fill();g.fillStyle='#2a1a10';g.beginPath();g.arc(-0.8,0,3.6,Math.PI*0.5,Math.PI*1.5);g.fill();
 g.restore();
}
function render(){
 if(!M)return;const g=ctx;const b=M.ball;const sc=M.scale*DPR;
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#111';g.fillRect(0,0,cv.width,cv.height);
 g.setTransform(sc,0,0,sc,cv.width/2-M.cam.x*sc,cv.height/2-M.cam.y*sc);
 g.drawImage(M.pitch,-MARG,-MARG,W+2*MARG,H+2*MARG);
 // ctrl ring
 const c=M.ctrl;
 if(c&&!c.red){g.strokeStyle='#ffd23f';g.lineWidth=2.2;g.beginPath();g.ellipse(c.x,c.y+2,13,9,0,0,7);g.stroke()}
 // ball shadow
 g.fillStyle='rgba(0,0,0,0.35)';g.beginPath();g.ellipse(b.x+b.z*0.35+1.5,b.y+b.z*0.25+2,4.5,3.2,0,0,7);g.fill();
 const list=M.all.filter(p=>!p.red).sort((a,c)=>a.y-c.y);
 let ballDrawn=false;
 for(const p of list){if(!ballDrawn&&b.y-b.z*0.5<p.y){drawBall(g);ballDrawn=true}drawPlayer(g,p,M.kits[p.team],p.role==='GK'?M.gkKit[p.team]:null)}
 if(!ballDrawn)drawBall(g);
 // goal crossbar overlay for top goal
 g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(GX0,0);g.lineTo(GX1,0);g.stroke();g.beginPath();g.moveTo(GX0,H);g.lineTo(GX1,H);g.stroke();
 // labels
 g.textAlign='center';g.font='bold 9px Arial';
 if(c&&!c.red){g.fillStyle='#ffd23f';g.beginPath();g.moveTo(c.x-5,c.y-24);g.lineTo(c.x+5,c.y-24);g.lineTo(c.x,c.y-17);g.fill();
  g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=2.5;g.strokeText(c.name,c.x,c.y-28);g.fillText(c.name,c.x,c.y-28);
  if(M.charge){const t=clamp(M.charge.t/(M.charge.k==='s'?0.75:0.28),0,1);g.fillStyle='#0009';g.fillRect(c.x-16,c.y+14,32,5);g.fillStyle=M.charge.k==='s'?(t>0.85?'#ff3b3b':'#ffd23f'):'#2ecc71';g.fillRect(c.x-15,c.y+15,30*t,3)}}
 if(b.owner&&b.owner.team===1){const o=b.owner;g.fillStyle='#ffb3b3';g.strokeStyle='#000';g.lineWidth=2.5;g.strokeText(o.name,o.x,o.y-18);g.fillText(o.name,o.x,o.y-18)}
 // screen-space effects
 g.setTransform(DPR,0,0,DPR,0,0);
 const wx=M.wx;
 if(wx.tint){g.fillStyle=wx.tint;g.fillRect(0,0,cssW,cssH)}
 if(wx.night){g.fillStyle='rgba(4,8,30,0.55)';g.fillRect(0,0,cssW,cssH);g.globalCompositeOperation='lighter';
  const sx=x=>(x-M.cam.x)*M.scale+cssW/2,sy=y=>(y-M.cam.y)*M.scale+cssH/2;
  for(const[x,y]of[[-120,-120],[W+120,-120],[-120,H+120],[W+120,H+120]]){const r=g.createRadialGradient(sx(x),sy(y),0,sx(x),sy(y),700*M.scale);r.addColorStop(0,'rgba(255,250,210,0.17)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,cssW,cssH)}
  g.globalCompositeOperation='source-over'}
 if(wx.fog){const r=g.createRadialGradient(cssW/2,cssH/2,Math.min(cssW,cssH)*0.15,cssW/2,cssH/2,Math.max(cssW,cssH)*0.7);r.addColorStop(0,'rgba(220,225,230,0.12)');r.addColorStop(1,'rgba(220,225,230,0.75)');g.fillStyle=r;g.fillRect(0,0,cssW,cssH)}
 if(wx.part==='rain'){g.strokeStyle='rgba(190,210,255,0.45)';g.lineWidth=1.2;g.beginPath();for(const q of M.parts){const x=q.x*cssW,y=q.y*cssH;g.moveTo(x,y);g.lineTo(x+4*q.s,y+16*q.s)}g.stroke()}
 else if(wx.part==='snow'){g.fillStyle='rgba(255,255,255,0.85)';for(const q of M.parts){g.beginPath();g.arc(q.x*cssW,q.y*cssH,1.5+q.s*2,0,7);g.fill()}}
 else if(wx.part==='leaf'){for(const q of M.parts){g.save();g.translate(q.x*cssW,q.y*cssH);g.rotate(q.r);g.fillStyle=q.s>0.75?'#c27c2a':'#8a6d1f';g.fillRect(-4,-2,8,4);g.restore()}}
 drawRadar(g);
 drawHUD();
}
function drawBall(g){const b=M.ball;const r=4.3*(1+b.z/160);const y=b.y-b.z*0.55;
 g.fillStyle='#fff';g.beginPath();g.arc(b.x,y,r,0,7);g.fill();g.strokeStyle='#333';g.lineWidth=0.8;g.stroke();
 g.fillStyle='#222';const a=b.spin;for(let i=0;i<3;i++){const t=a+i*2.1;g.beginPath();g.arc(b.x+Math.cos(t)*r*0.5,y+Math.sin(t)*r*0.5,r*0.28,0,7);g.fill()}}
function drawRadar(g){
 const w=58,h=w*H/W,x0=cssW-w-10,y0=56;
 g.fillStyle='rgba(10,40,20,0.65)';g.fillRect(x0,y0,w,h);g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=1;g.strokeRect(x0,y0,w,h);g.beginPath();g.moveTo(x0,y0+h/2);g.lineTo(x0+w,y0+h/2);g.stroke();
 for(const p of M.all){if(p.red)continue;g.fillStyle=p===M.ctrl?'#ffd23f':p.team===0?M.kits[0].c1:M.kits[1].c1;g.beginPath();g.arc(x0+p.x/W*w,y0+p.y/H*h,p===M.ctrl?2.6:1.9,0,7);g.fill();if(p.team===0){g.strokeStyle='rgba(255,255,255,.7)';g.stroke()}}
 g.fillStyle='#fff';g.beginPath();g.arc(x0+M.ball.x/W*w,y0+M.ball.y/H*h,1.6,0,7);g.fill();
}
let hudKey='';
function drawHUD(){
 const m=Math.min(90,Math.floor((M.half-1)*45+M.clock/M.halfLen*45));const t0=M.names[0],t1=M.names[1];
 const key=M.score.join()+m+M.half;
 if(key!==hudKey){hudKey=key;
  $('#score').innerHTML=`<div class="tm"><span class="kit" style="background:${M.kits[0].c1}"></span>${esc(t0.abbr)}</div><div class="sc">${M.score[0]} - ${M.score[1]}</div><div class="tm">${esc(t1.abbr)}<span class="kit" style="background:${M.kits[1].c1}"></span></div><div class="clk">${String(m).padStart(2,'0')}'</div>`;
  $('#meta').textContent=`${M.st.name} • ${M.wx.ic} ${M.wx.fa} • 🟨 ${M.ref.n}`}
 const own=M.ball.owner&&M.ball.owner===M.ctrl;const lab=own?['شوت','پاس']:['تکل','تعویض'];
 if($('#lShoot').textContent!==lab[0]){$('#lShoot').textContent=lab[0];$('#lPass').textContent=lab[1]}
}
let banTO=null;
function banner(big,small,dur){const el=$('#banner');if(!big&&!small)return;el.innerHTML=(big?esc(big):'')+(small?`<small>${small}</small>`:'');el.style.fontSize=big?'':'0';el.style.opacity=1;clearTimeout(banTO);banTO=setTimeout(()=>el.style.opacity=0,(dur||1.4)*1000)}

function loop(ts,me){if(!M||M!==me)return;const dt=Math.min(0.033,(ts-M.last)/1000);M.last=ts;if(!M.paused){update(dt)}if(M===me){render();requestAnimationFrame(t=>loop(t,me))}}

/* ================= INPUT ================= */
const joy=$('#joy'),jz=$('#joyZone');let joyId=null,jox=0,joy0=0;
jz.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;jz.setPointerCapture(e.pointerId);const r=jz.getBoundingClientRect();jox=e.clientX;joy0=e.clientY;
 joy.style.display='block';joy.style.left=(e.clientX-r.left-60)+'px';joy.style.top=(e.clientY-r.top-60)+'px';$('#joyHint').style.display='none';setJoy(e);ac()});
jz.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
const joyEnd=e=>{if(e.pointerId!==joyId)return;joyId=null;IN.jm=0;IN.jx=IN.jy=0;joy.style.display='none';joy.firstChild.style.transform=''};
jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);
function setJoy(e){let dx=e.clientX-jox,dy=e.clientY-joy0;const d=Math.hypot(dx,dy),mx=50;if(d>mx){dx*=mx/d;dy*=mx/d}
 joy.firstChild.style.transform=`translate(${dx}px,${dy}px)`;const m=Math.min(1,d/mx);if(d<4){IN.jm=0;return}IN.jm=m;IN.jx=dx/Math.hypot(dx,dy);IN.jy=dy/Math.hypot(dx,dy)}
function bindPad(id,down,up,hold){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('dn');ac();if(hold)IN.sprint=true;else IN.ev.push(down)});
 const u=e=>{el.classList.remove('dn');if(hold)IN.sprint=false;else IN.ev.push(up)};el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)}
bindPad('#bShoot','sd','su');bindPad('#bPass','pd','pu');bindPad('#bSprint',null,null,true);
$('#pauseB').addEventListener('click',()=>{if(!M||M.ended)return;M.paused=true;
 dialog('بازی متوقف شد',[['ادامه',()=>{if(M){M.paused=false;M.last=performance.now()}}],['خروج از بازی',()=>{
  if(M&&M.cfg.mode!=='friendly')dialog('اگر خارج شوی، بازی با باخت ثبت می‌شود.',[['خروج',()=>finishMatch(true),'red'],['برگرد',()=>{if(M){M.paused=false;M.last=performance.now()}},'gray']]);else finishMatch(true)},'red']])});
const KM={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
addEventListener('keydown',e=>{if(!M)return;if(e.repeat){if(KM[e.code]||e.code==='Space')e.preventDefault();return}IN.keys[e.code]=true;
 if(e.code==='Space'){IN.ev.push('sd');e.preventDefault()}if(e.code==='KeyX'||e.code==='KeyK')IN.ev.push('pd');if(e.code==='ShiftLeft'||e.code==='ShiftRight')IN.sprint=true;keyJoy();if(KM[e.code])e.preventDefault()});
addEventListener('keyup',e=>{if(!M)return;IN.keys[e.code]=false;if(e.code==='Space')IN.ev.push('su');if(e.code==='KeyX'||e.code==='KeyK')IN.ev.push('pu');if(e.code==='ShiftLeft'||e.code==='ShiftRight')IN.sprint=false;keyJoy()});
function keyJoy(){if(joyId!==null)return;let x=0,y=0;for(const k in KM)if(IN.keys[k]){x+=KM[k][0];y+=KM[k][1]}const d=Math.hypot(x,y);if(d){IN.jx=x/d;IN.jy=y/d;IN.jm=1}else{IN.jm=0}}

showMenu();
</script>
